# pickle-base.conf — base nginx wiring the proxy-agent depends on (LXC 100).
#
# Placed once by deploy.sh, INCLUDED from the http{} block of the main nginx.conf
# (NOT owned by the agent — the agent only writes /etc/nginx/pickle.d/<fqdn>.conf).
# The agent-rendered vhosts rely on the two things defined here, and on the rate-limit
# zones noted below, which another file declares into this same http{} context.

# 1) websocket upgrade map — the shared proxy-common snippet in every rendered vhost
#    sets `Connection $connection_upgrade`, which resolves via this map. Defining it
#    once here (http{} context) keeps each vhost a self-contained single file.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2) the agent-managed include glob. Every FQDN's server blocks live under here.
#    `nginx -t` validates these together with the rest of the config, which is why
#    the agent writes into this dir then tests, rolling back on failure.
include /etc/nginx/pickle.d/*.conf;

# NOTE (operator-managed, referenced by rendered vhosts, NOT written by the agent):
#   the limit_req and limit_conn zones named pickle_site and pickle_site_perip. Every
#   rendered HTTPS vhost references them while PICKLE_PROXY_AGENT_SITE_LIMITS is on.
#   Both have to be declared somewhere in the http{} context. Order relative to this
#   file does not matter: nginx resolves a shared-memory zone name once the whole
#   configuration is parsed, not where the directive is read. Existence does matter,
#   and a vhost naming a zone declared nowhere fails `nginx -t` for the entire
#   configuration rather than for the one file. That failure reads
#   `[emerg] zero size shared memory zone "<name>"`, which does not announce itself as
#   a missing declaration, and it is printed AFTER `syntax is ok` — so anything that
#   judges the test by that string instead of the exit code calls a broken
#   configuration fine. Run the agent with the variable off until the zones are in place.
#
# NOTE (stream{} SNI): the stream block owns :443, prepends the PROXY header and routes
# every SNI to 127.0.0.1:8443, where the agent's HTTPS vhosts listen. The map carries a
# single default and no per-name entries, so every name on this host is terminated on
# this tier, opus.pusan.ac.kr included; its vhost is hand-written and sits outside the
# agent-owned include above.
# worker_shutdown_timeout should be set (e.g. 3600s) in the main nginx.conf so that
# graceful reloads do not sever long-lived WebSocket (web-terminal) connections.
